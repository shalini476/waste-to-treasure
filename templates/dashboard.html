{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

  <!-- Waste Form (for giver) -->
  {% if session['role'] == 'giver' %}
  <h3>Add Waste Item</h3>
  <form id="wasteForm">
    <input type="text" class="form-control mb-2" name="category" placeholder="Category" required>
    <input type="text" class="form-control mb-2" name="description" placeholder="Description" required>
    <input type="text" class="form-control mb-2" name="quantity" placeholder="Quantity" required>
    <input type="text" class="form-control mb-2" name="location" placeholder="Location" required>
    <button type="submit" class="btn btn-success">Add Waste</button>
  </form>
  {% endif %}

  <!-- Need Form (for receiver) -->
  {% if session['role'] == 'receiver' %}
  <h3>Add Need Item</h3>
  <form id="needForm">
    <input type="text" class="form-control mb-2" name="category" placeholder="Category" required>
    <input type="text" class="form-control mb-2" name="description" placeholder="Description" required>
    <input type="text" class="form-control mb-2" name="quantity" placeholder="Quantity" required>
    <input type="text" class="form-control mb-2" name="location" placeholder="Location" required>
    <button type="submit" class="btn btn-primary">Add Need</button>
  </form>
  {% endif %}

  <!-- Section for AI Matches -->
  <div id="matchesSection" class="mt-5">
    <h4>🔍 AI Suggested Matches</h4>
    <div id="matchesContainer" class="table-responsive"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  // Function to load matches from backend
  async function loadAIMatches() {
    const response = await fetch('/suggest_matches');
    const data = await response.json();

    const container = document.getElementById('matchesContainer');
    container.innerHTML = '';

    if (!data.length) {
      container.innerHTML = "<p class='text-muted'>No matches found yet. Add more data!</p>";
      return;
    }

    let html = `
      <table class="table table-bordered table-striped mt-3">
        <thead class="table-light">
          <tr>
            <th>Waste Category</th>
            <th>Need Category</th>
            <th>Waste Location</th>
            <th>Need Location</th>
            <th>Match Score</th>
          </tr>
        </thead>
        <tbody>
    `;
    data.forEach(row => {
      html += `
        <tr>
          <td>${row.waste_category}</td>
          <td>${row.need_category}</td>
          <td>${row.waste_location}</td>
          <td>${row.need_location}</td>
          <td>${row.score}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  // Handle form submissions dynamically
  const wasteForm = document.getElementById('wasteForm');
  const needForm = document.getElementById('needForm');

  if (wasteForm) {
    wasteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(wasteForm);
      await fetch('/add_waste', { method: 'POST', body: formData });
      wasteForm.reset();
      await loadAIMatches();  // Load matches immediately
    });
  }

  if (needForm) {
    needForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(needForm);
      await fetch('/add_need', { method: 'POST', body: formData });
      needForm.reset();
      await loadAIMatches();  // Load matches immediately
    });
  }

  // Also load matches when page opens
  loadAIMatches();
});
</script>

{% endblock %}
