{% extends "base.html" %}
{% block content %}
<h2 class="text-center mb-4">Let's Share!</h2>

{% if user.role == 'giver' or user.role == 'both' %}
<!-- Waste Form -->
<div class="card shadow p-4 mb-4">
    <h5>Add Waste Item</h5>
    <form method="POST" action="/add_waste">
        <div class="mb-2">
            <label class="form-label">Category</label>
            <input type="text" class="form-control" name="category" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="2" required></textarea>
        </div>
        <div class="mb-2">
            <label class="form-label">Quantity</label>
            <input type="text" class="form-control" name="quantity" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" required>
        </div>
        <button type="submit" class="btn btn-success w-100 mt-2">Add Waste</button>
    </form>
</div>
{% endif %}

{% if user.role == 'receiver' or user.role == 'both' %}
<!-- Need Form -->
<div class="card shadow p-4 mb-4">
    <h5>Add Needed Resource</h5>
    <form method="POST" action="/add_need">
        <div class="mb-2">
            <label class="form-label">Category</label>
            <input type="text" class="form-control" name="category" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="2" required></textarea>
        </div>
        <div class="mb-2">
            <label class="form-label">Quantity</label>
            <input type="text" class="form-control" name="quantity" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" required>
        </div>
        <button type="submit" class="btn btn-success w-100 mt-2">Add Need</button>
    </form>
</div>
{% endif %}

<!-- Suggested Matches -->
<div class="card shadow p-4">
    <h5 class="mb-3">AI or Database Matches</h5>
    <button class="btn btn-outline-success mb-3" id="loadMatchesBtn">Find Matches</button>
    <div id="matchesList" class="table-responsive"></div>
</div>

<script>
document.getElementById("loadMatchesBtn").addEventListener("click", () => {
    fetch("/suggest_matches")
    .then(r => r.json())
    .then(data => {
        const div = document.getElementById("matchesList");
        if (!data.length) {
            div.innerHTML = "<p class='text-danger'>No exact matches found. Showing related items...</p>";
            return;
        }
        let html = `<table class="table table-bordered">
            <thead><tr><th>Waste</th><th>Receiver Need</th><th>Score</th></tr></thead><tbody>`;
        data.forEach(m => {
            html += `<tr>
                <td>${m.waste_category} (${m.waste_location})</td>
                <td>${m.need_category} (${m.need_location})</td>
                <td>${m.score.toFixed(2)}</td>
            </tr>`;
        });
        html += "</tbody></table>";
        div.innerHTML = html;
    })
    .catch(() => {
        document.getElementById("matchesList").innerHTML =
            "<p class='text-warning'>No related matches available at this moment.</p>";
    });
});
</script>
{% endblock %}
